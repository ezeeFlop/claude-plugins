[project]
name = "spt-models-mcp"
version = "1.6.0"
description = "MCP server for the SPT Models GPU inference stack (Claude Code plugin)."
requires-python = ">=3.10"
dependencies = [
    # MCP SDK 2.0 removed mcp.server.fastmcp; this server targets the 1.x FastMCP API.
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
