[project]
name = "spt-models-mcp"
version = "1.9.0"
description = "MCP bundle for the SPT Models GPU inference stack."
requires-python = ">=3.10"
dependencies = [
    # Works on both majors: SDK 2.0 renamed FastMCP to MCPServer, and main.py
    # imports whichever is present.
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
